# Mobile builds — iOS/Android compile + release verification (TASK-M10-03)
#
# Hardening of the M7-01 skeleton: the blanket continue-on-error is gone.
# The verification chain is now REQUIRED:
#   - ios (required):         simulator RELEASE build (unsigned, no signing
#                             team needed) — proves the release configuration
#                             compiles and bundles end to end.
#   - android (required):     debug build (auto-signed with the debug
#                             keystore) after `tauri android init`.
# Best-effort companions (per-job continue-on-error with explicit notes):
#   - ios-device:             device RELEASE build, unsigned. Needs an Apple
#                             signing team for an installable .ipa, so CI can
#                             only verify the device toolchain compiles
#                             (docs/mobile-signing.md).
#   - android release step:   RELEASE build. Requires a release keystore
#                             (docs/mobile-signing.md); without one Gradle
#                             fails — expected, documented, never blocks.
#
# Signing/provisioning and the store checklists are documented in
# docs/mobile-signing.md; CI stays unsigned everywhere.

name: Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS release build (simulator)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build iOS app (simulator, release, unsigned)
        run: pnpm tauri ios build --target aarch64-sim --ci --no-sign

  ios-device:
    name: iOS release build (device, best effort)
    runs-on: macos-latest
    # Best-effort: without an Apple signing team the device bundle compiles
    # but is not installable. This job only verifies the aarch64-apple-ios
    # toolchain; real device/IPA builds need the team + profiles from
    # docs/mobile-signing.md and stay out of CI.
    continue-on-error: true
    # Setup steps below duplicate the ios job's (checkout → pnpm → node →
    # rust → cargo cache); kept inline so each job stays self-contained.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build iOS app (device, release, unsigned)
        run: pnpm tauri ios build --target aarch64 --ci --no-sign

  android:
    name: Android build (debug + release best effort)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 27.2.12479018

      # gen/android is NOT committed (the local machine has no Android SDK,
      # TASK-M7-01), so CI must scaffold it first; ios needs no init because
      # gen/apple is committed.
      - name: Init Android project
        run: pnpm tauri android init --ci

      - name: Build Android app (debug)
        run: pnpm tauri android build --debug --ci

      - name: Build Android app (release, best effort)
        # Best-effort: release signing needs a keystore (docs/mobile-signing.md,
        # gradle signingConfigs once the scaffold lands). The debug keystore
        # signs debug builds automatically, so the debug build above is the
        # required verification chain; a failed release here is expected and
        # documented, never a blocker.
        continue-on-error: true
        run: pnpm tauri android build --ci
