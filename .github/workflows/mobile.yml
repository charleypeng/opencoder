# Mobile builds — iOS/Android compile verification (SKELETON, TASK-M7-01)
#
# Debug, unsigned compile checks only: verifies the mobile build chain stays
# green while mobile features land (M7). Jobs run best-effort and never block
# the desktop pipeline.
#
# Full hardening (signing, provisioning, keystores, artifacts, release) lands
# in M10-03.
#
# Current scope:
#   - ios:    macOS runner, `tauri ios build --debug` (simulator, unsigned)
#   - android: Linux runner, JDK 17 + Android SDK/NDK, `tauri android build --debug`

name: Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS debug build
    runs-on: macos-latest
    # Best-effort until M10-03 hardens the mobile pipeline.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build iOS app (simulator, debug)
        run: pnpm tauri ios build --debug --target aarch64-sim --ci

  android:
    name: Android debug build
    runs-on: ubuntu-22.04
    # Best-effort until M10-03 hardens the mobile pipeline.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 27.2.12479018

      - name: Build Android app (debug)
        run: pnpm tauri android build --debug --ci
