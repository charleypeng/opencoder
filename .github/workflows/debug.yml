# Debug release channel: tag-triggered GitHub Release with an UNSIGNED
# Windows + macOS (dmg) installer set.
#
# Deliberately different from release.yml:
#   - Only two platforms: macOS universal (app+dmg) and Windows x64 (nsis).
#   - Never signed: no Apple certificate import (Gatekeeper will warn, see
#     docs/release-signing.md) and no TAURI_SIGNING_PRIVATE_KEY requirement —
#     a throwaway CI updater signing key is generated when the secret is
#     absent (same fallback as desktop.yml) so the build stays green.
#   - The release is PUBLISHED immediately instead of staying a draft.
#
# Warning: these .sig files come from the throwaway CI key and do NOT match
# tauri.conf.json's pubkey — do not feed these artifacts to the in-app
# updater, they are plain installer downloads only.
#
# Flow:
#   v* tag ->
#   version-check: resolve vX.Y.Z, assert package.json / tauri.conf.json /
#                  Cargo.toml all match (scripts/check-version.mjs), extract
#                  the CHANGELOG section (scripts/release-notes.mjs) and
#                  create the PUBLISHED release with it
#   build matrix:  macOS universal (app+dmg), Windows x64 (nsis) — each job
#                  uploads its artifacts via tauri-apps/tauri-action@v0
#                  (idempotent per tag: the release created above is found by
#                  tag, never modified, each job just adds its assets)

name: debug

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

env:
  # Updater artifacts must be signed; without a real secret a throwaway CI
  # key is generated below (same fallback as desktop.yml).
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  version-check:
    name: Version sync check
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        id: resolve
        run: |
          TAG="${{ github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check version sync
        run: node scripts/check-version.mjs ${{ steps.resolve.outputs.version }}

      - name: Extract release notes
        run: |
          node scripts/release-notes.mjs ${{ steps.resolve.outputs.version }} \
            --out release-notes.md

      # Published immediately (no --draft): debug builds are meant to be
      # downloadable without an extra publish step.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "opencoder $TAG" \
              --notes-file release-notes.md
          fi

  build:
    name: Build and upload (${{ matrix.platform }})
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Unsigned debug builds never fail on the updater key: same throwaway
      # CI key fallback as desktop.yml (these .sig files must not be fed to
      # the in-app updater). shell: bash — the step uses bash syntax
      # ($RUNNER_TEMP, line continuation) and Windows runners default to
      # PowerShell.
      - name: Generate CI updater signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        shell: bash
        run: |
          pnpm tauri signer generate --ci -w "$RUNNER_TEMP/ci-signing.key"
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/ci-signing.key" \
            >> "$GITHUB_ENV"

      # Build + upload to the release created in version-check. No signing
      # secrets are set anywhere in this workflow, so the installers ship
      # unsigned.
      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.version-check.outputs.tag }}
          releaseName: opencoder ${{ needs.version-check.outputs.tag }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
