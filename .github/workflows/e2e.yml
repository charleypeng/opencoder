# E2E — L4 Playwright suite (TASK-M10-01)
#
# Runs the 12 core journeys (docs/testing.md §3 L4, tests/e2e/*.spec.ts) in
# headless Chromium against vite dev (VITE_TRANSPORT=fetch) + the Mock
# OpenCode Server (--cors), both auto-started by the playwright webServer
# config. The Tauri IPC surface is provided in-browser by the
# tests/e2e/tauri-shim.js init script — no Tauri runtime in CI.
#
# tauri-driver shell-level cases (window chrome / tray / shortcuts) are
# documented as env-blocked in docs/tasks/M10.md (M10-02/03 cover desktop
# packaging verification instead).

name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/e2e/**"
      - "tests/mock-server/**"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "tests/e2e/**"
      - "tests/mock-server/**"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
