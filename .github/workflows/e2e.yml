# E2E — L4 Playwright suite (SKELETON, TASK-M0-07)
#
# This is a placeholder workflow: the full Playwright E2E suite (12 core
# journeys per docs/testing.md §4) lands in M10.
#
# Today the job only installs dependencies and runs the `test:e2e` placeholder
# script, which prints a notice and exits 0. The PR path trigger is scoped to
# `tests/e2e/**` so the workflow starts exercising real E2E tests once M10
# creates that directory — update this file when wiring the real suite.
#
# M10 will add: `playwright install --with-deps`, xvfb-run, vite dev
# (VITE_TRANSPORT=fetch) + Mock Server (CORS), and trace/screenshot uploads.

name: E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/e2e/**"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E suite
        run: pnpm test:e2e
