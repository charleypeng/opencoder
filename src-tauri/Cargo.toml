[package]
name = "opencoder"
version = "0.1.0"
description = "Tauri 2 + SolidJS desktop client for OpenCode"
authors = ["opencoder contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opencoder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-glass = { path = "plugins/glass" }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "charset"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
tauri-plugin-store = "2"
mdns-sd = "0.20"
flume = { version = "0.12", features = ["async"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tauri-plugin-haptics = "2.3.2"
tauri-plugin-barcode-scanner = "2.4.5"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-single-instance = "2.4.3"
window-vibrancy = "0.8.0"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

