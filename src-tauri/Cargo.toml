[package]
name = "opencoder"
version = "1.2.0"
description = "Tauri 2 + SolidJS desktop client for OpenCode"
authors = ["opencoder contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opencoder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-glass = { path = "plugins/glass" }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "charset"] }
# The mobile TLS crypto provider: reqwest 0.13 (pulled in by tauri 2.11)
# compiles with `rustls-no-provider`, so the app must install a provider
# before any Client is built — otherwise Client::new() panics on iOS
# ("No rustls crypto provider is configured"). ring matches the provider
# already in the lockfile (via reqwest 0.12's rustls-tls).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
# PKCE (RFC 7636) for the RFC 9728 OAuth client: random verifier (rand),
# S256 challenge (sha2) and base64url encoding (base64). All three are
# already in the lockfile as transitive deps; declared here for direct use.
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-store = "2"
mdns-sd = "0.20"
flume = { version = "0.12", features = ["async"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tauri-plugin-haptics = "2.3.2"
tauri-plugin-barcode-scanner = "2.4.5"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2"
window-vibrancy = "0.8.0"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2.0.0"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
