<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- TASK-M7-04: viewport-fit=cover lets the web content extend under
         the notch/home indicator so env(safe-area-inset-*) has real values
         to pad against; interactive-widget=resizes-content makes the
         viewport resize to the area above the virtual keyboard, so the
         bottom-anchored composer stays visible above it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <title>opencoder</title>
    <script>
      // TASK-M9-03 no-flicker theme pre-read: resolve the persisted theme
      // (oc-theme, system preference when absent) and accent (oc-accent)
      // BEFORE the app bundle runs, so the first paint is already themed.
      // Mirrors src/stores/theme.ts; the OLED true-black gate mirrors the
      // platform detect fallback (src/platform/index.ts): a mobile UA OR
      // the webkit + touch + phone-ish viewport branch (iPadOS desktop-UA
      // mode), so the pre-read never flashes dark→oled one frame later.
      (function () {
        try {
          var doc = document.documentElement;
          var mode = localStorage.getItem("oc-theme");
          var isDark =
            mode === "dark" ||
            (mode !== "light" &&
              !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches));
          var theme = isDark ? "dark" : "light";
          if (
            isDark &&
            localStorage.getItem("oc-oled") === "1" &&
            (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
              (!!window.webkit &&
                "ontouchstart" in window &&
                window.innerWidth > 0 &&
                window.innerWidth <= 1024) ||
              ("ontouchstart" in window && window.innerWidth > 0 && window.innerWidth <= 768))
          ) {
            theme = "oled";
          }
          doc.dataset.theme = theme;
          var accent = localStorage.getItem("oc-accent");
          if (accent) {
            var PRESETS = {
              indigo: "#7c8cff",
              emerald: "#34d399",
              amber: "#fbbf24",
              coral: "#f87171",
              cyan: "#22d3ee",
              purple: "#c084fc",
            };
            var color = PRESETS[accent] || (/^#[0-9a-f]{3,8}$/i.test(accent) ? accent : null);
            if (color) doc.style.setProperty("--accent", color);
          }
        } catch (e) {
          // A failing pre-read must never block startup.
        }
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
