<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- TASK-M7-04: viewport-fit=cover lets the web content extend under
         the notch/home indicator so env(safe-area-inset-*) has real values
         to pad against; interactive-widget=resizes-content makes the
         viewport resize to the area above the virtual keyboard, so the
         bottom-anchored composer stays visible above it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <title>opencoder</title>
    <script>
      // TASK-M9-03 no-flicker theme pre-read: resolve the persisted theme
      // (oc-theme, gray on desktop / system on mobile when absent) and accent (oc-accent)
      // BEFORE the app bundle runs, so the first paint is already themed.
      // Mirrors src/stores/theme.ts; the OLED true-black gate mirrors the
      // platform detect fallback (src/platform/index.ts): a mobile UA OR
      // the webkit + touch + phone-ish viewport branch (iPadOS desktop-UA
      // mode), so the pre-read never flashes dark→oled one frame later.
      (function () {
        var doc = document.documentElement;
        var ua = navigator.userAgent;
        var isMobile =
          /iPhone|iPad|iPod|Android/i.test(ua) ||
          ("webkit" in window &&
            "ontouchstart" in window &&
            window.innerWidth > 0 &&
            window.innerWidth <= 1024) ||
          (!/Mac OS X|Macintosh|Windows|Linux/i.test(ua) &&
            "ontouchstart" in window &&
            window.innerWidth > 0 &&
            window.innerWidth <= 768);
        // Storage failures still need the same platform defaults as the store.
        function read(key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }
        try {
          var mode = read("oc-theme");
          if (["gray", "dark", "light", "system"].indexOf(mode) === -1) {
            mode = isMobile ? "system" : "gray";
          }
          var isDark =
            mode === "dark" ||
            (mode === "system" &&
              !!(
                typeof window.matchMedia === "function" &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
              ));
          var theme = mode === "gray" ? "gray" : isDark ? "dark" : "light";
          if (isDark && read("oc-oled") === "1" && isMobile) {
            theme = "oled";
          }
          doc.dataset.theme = theme;
          var accent = read("oc-accent");
          {
            var PRESETS = {
              indigo: "#7c8cff",
              emerald: "#34d399",
              amber: "#fbbf24",
              coral: "#f87171",
              cyan: "#22d3ee",
              purple: "#c084fc",
              neutral: isDark ? "#c3c6cc" : "#50545b",
            };
            var color =
              PRESETS[accent] ||
              (/^#[0-9a-f]{3,8}$/i.test(accent)
                ? accent
                : PRESETS[isMobile ? "indigo" : "neutral"]);
            doc.style.setProperty("--accent", color);
          }
          // UI-scale pre-read: mirrors src/stores/uiScale.ts. Desktop
          // maps the persisted relative factor (default 1.0, clamped to
          // 0.9-1.6) to the 1.2 physical baseline through --ui-scale;
          // mobile stays 1 so the native Liquid Glass tab bar
          // coordination (safe-area reserves) never scales with the web
          // content. Set before first paint so the app never size-jumps.
          var scale = parseFloat(read("oc-ui-scale") || "");
          var UI_SCALE_BASE = 1.2;
          var UI_SCALE_VERSION = "2";
          if (!isFinite(scale)) {
            scale = 1;
          } else {
            scale = Math.min(1.6, Math.max(0.9, Math.round(scale * 100) / 100));
            if (read("oc-ui-scale-version") !== UI_SCALE_VERSION) {
              scale = Math.min(1.6, Math.max(0.9, Math.round((scale / UI_SCALE_BASE) * 100) / 100));
              try {
                localStorage.setItem("oc-ui-scale", String(scale));
                localStorage.setItem("oc-ui-scale-version", UI_SCALE_VERSION);
              } catch (e) {
                // The resolved scale can still apply when writes are blocked.
              }
            }
          }
          doc.style.setProperty(
            "--ui-scale",
            isMobile ? "1" : String(Math.round(scale * UI_SCALE_BASE * 100) / 100),
          );
        } catch (e) {
          // A failing pre-read must never block startup.
        }
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
